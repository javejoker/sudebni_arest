name: Prepare exact template blobs
on:
  push:
    paths:
      - '.github/workflows/prepare-templates.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconstruct and verify approved templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, zipfile, zlib
          REPO = 'javejoker/sudebni_arest'
          API = 'https://api.github.com/repos/' + REPO
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(API + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'approved-template-publication'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def blob(sha):
              response = request('/git/blobs/' + sha)
              assert response['encoding'] == 'base64'
              data = base64.b64decode(response['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              return data
          app = bytearray(blob('19a95657e6592b49356cbc1dffbe45457ff058e0'))
          assert len(app) == 20265 and app[11265] == 61
          app[11265] = 245
          chunks = [
              'c47b5a434f4840d8aee28427f33572948b2554da',
              '197fa8d905fb4cc9af94d41b7387f1fd244583eb',
              '222d5027086c76e00751617149d1e28bcdcecae5',
              '66ed94cdc87154fcbf43b7cbb14722cd44b648c5',
              'a93a1caccb33864fd422c62b01a8e6de16b3458d',
              '9af39d75c983c774a6de03152b9c8c41815c8e96',
              '5adbb4c711f447afc793aab1c76dbf7efff9deb4',
              'dddcb1f0760b3300fbc4bf5c3a32362857d6993a',
              '126d4db0053450773914ce07898b4a0a58f914c3',
          ]
          motion = zlib.decompress(base64.b64decode(b''.join(blob(sha) for sha in chunks), validate=True))
          templates = [
              ('application_cancel_decision.docx', bytes(app), 20265,
               '0fd6b78c72c8c123b418bd191e3b1cbbfdc33b48e01fbc12a84813e0c43272a6',
               'db21ec73ea5a2f09eae9bae9d775e6bc1ee6ed32'),
              ('motion_restore_term.docx', motion, 18047,
               '5ec8add42dc52eab9e0319764efb481fcd84a6d922ca3541a86731cc6960e91d',
               'fab03f918901c189bdfdb96838f83a46586ce791'),
          ]
          for name, data, size, sha256, git_sha in templates:
              assert len(data) == size, name
              assert hashlib.sha256(data).hexdigest() == sha256, name
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  assert archive.testzip() is None, name
              result = request('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')})
              assert result['sha'] == git_sha, name
              print('VERIFIED', name, 'bytes=' + str(size), 'sha256=' + sha256, 'git_blob=' + git_sha)
          print('BOTH_ORIGINAL_TEMPLATE_BLOBS_VERIFIED')
          PY
